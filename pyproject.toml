[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobguard"
version = "1.0.0"
description = "Explainable fake-job-posting detection: ensemble ML + FastAPI + React."
requires-python = ">=3.11"
readme = "README.md"

# Runtime deps live in requirements.txt (pinned for reproducible Docker builds);
# this section keeps `pip install -e .` self-sufficient for the core library.
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "imbalanced-learn>=0.12",
  "scipy>=1.11",
  "joblib>=1.3",
]

[tool.setuptools]
packages = ["jobguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
